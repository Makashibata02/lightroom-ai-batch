[tools]
node = "24.21.0"
bun = "1.4.2"
lua = "5.5.1"
# selene (Rust) is the Lua linter — see lua:lint. A native binary, so unlike
# luacheck it does not run on the Lua above and is immune to Lua-version breaks.
"aqua:Kampfkarren/selene" = "0.31.0"

[env]
# Project-local LuaRocks tree (busted) installed by `lua:deps`.
_.path = ["lua_modules/bin"]

[tasks.install]
description = "Install dependencies"
run = "cd server && npm install"

[tasks.build]
description = "Build TypeScript MCP server"
run = "cd server && npm run build"

[tasks.test]
description = "Run tests"
run = "cd server && npm test"

[tasks.dev]
description = "Build in watch mode"
run = "cd server && npm run watch"

[tasks.binary]
description = "Build the Windows x64 MCP executable via Bun"
run = "node scripts/build-binary.mjs --targets=bun-windows-x64"

[tasks."config:sync"]
description = "Copy the canonical pipeline config into the Lightroom plugin"
run = "node scripts/sync-config.mjs"

[tasks."config:check"]
description = "Verify the plugin config matches the canonical config"
run = "node scripts/sync-config.mjs --check"

[tasks.release]
description = "Build both v1.0.0 Windows release ZIP files and SHA256SUMS"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1"

[tasks."lua:deps"]
description = "Install Lua test rocks (busted) into lua_modules/"
run = "test -x lua_modules/bin/busted || luarocks install --tree lua_modules busted"

[tasks."lua:test"]
description = "Run busted specs for the Lightroom plugin"
depends = ["lua:deps"]
run = "busted"

[tasks."lua:lint"]
description = "Lint the Lightroom plugin with selene"
run = "selene plugin/LightroomMCP.lrplugin"
