name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release from tag
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag input
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release ref must be an existing vX.Y.Z tag: $env:RELEASE_TAG"
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Confirm checkout is the requested tag
        shell: pwsh
        run: |
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw "HEAD is not $env:RELEASE_TAG" }

      - name: Install pinned project tools
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          cache: true

      - name: Install and verify
        working-directory: server
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run lint
          npm test -- --runInBand
          npm run build

      - name: Verify release metadata
        shell: pwsh
        run: |
          node scripts/bump-version.mjs --check
          node scripts/sync-config.mjs --check
          $version = (Get-Content server/package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }

      - name: Verify Lightroom plug-in
        shell: bash
        run: |
          mise run lua:lint
          mise run lua:test

      - name: Build release archives
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lightroom-ai-batch-${{ env.RELEASE_TAG }}
          path: |
            build/release/*.zip
            build/release/SHA256SUMS
          retention-days: 14

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = ($env:RELEASE_TAG).Substring(1)
          $notes = "docs/releases/$($env:RELEASE_TAG).md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          gh release create $env:RELEASE_TAG `
            "build/release/lightroom-ai-batch-plugin-v$version.zip" `
            "build/release/lightroom-ai-batch-mcp-windows-x64-v$version.zip" `
            "build/release/SHA256SUMS" `
            --verify-tag `
            --title "Lightroom AI Batch $env:RELEASE_TAG" `
            --notes-file $notes
